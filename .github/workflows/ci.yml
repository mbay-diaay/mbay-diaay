name: CI

on:
  pull_request:
  push:
    branches: [main]

# Droits minimaux : le jeton ne peut que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On annule les contrôles d'une demande de fusion remplacée par un envoi plus récent, jamais ceux de `main` :
  # chaque envoi sur `main` doit avoir son verdict, sinon on ne sait plus si la branche principale est verte.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Qualité (types, lint, format, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version lue dans "packageManager" de package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:host
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Parcours dans un navigateur (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:install
      - run: pnpm e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Sécurité (dépendances, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # l'analyse de secrets parcourt tout l'historique
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Vulnérabilités connues des dépendances de production
        run: pnpm audit --prod --audit-level high
      - name: Secrets dans l'historique
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest
          detect --source /repo --no-banner --redact --verbose

  # Dépôt privé : dependency-review exige GitHub Code Security / Advanced Security.
  # Réactiver (remettre if: github.event_name == 'pull_request') après activation.
  dependency-review:
    name: Revue des nouvelles dépendances
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
